name: Components Axci Test

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/axci-component-map.json"
      - ".github/axci-test-target-rules.json"
      - ".github/workflows/components-axci-test.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/axci-component-map.json"
      - ".github/axci-test-target-rules.json"
      - ".github/workflows/components-axci-test.yml"
  workflow_dispatch:
    inputs:
      component:
        description: "Component to test (auto/all/axconfig/axhal/axdriver)"
        required: false
        default: "auto"
        type: string
      test_targets:
        description: "Override test targets (empty means per-component default)"
        required: false
        default: ""
        type: string
      base_ref:
        description: "Base ref for dependency-aware detection"
        required: false
        default: "origin/main"
        type: string

permissions:
  contents: read

concurrency:
  group: components-axci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      skip_all: ${{ steps.matrix.outputs.skip_all }}
      integration_matrix: ${{ steps.matrix.outputs.integration_matrix }}
      check_matrix: ${{ steps.matrix.outputs.check_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get base ref
        id: git
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              BASE="${{ github.event.before }}"
            else
              BASE="HEAD~1"
            fi
          else
            BASE="${{ inputs.base_ref }}"
          fi
          echo "base_ref=$BASE" >> "$GITHUB_OUTPUT"

      - name: Checkout axci rules
        uses: actions/checkout@v4
        with:
          repository: yoinspiration/axci
          ref: test/auto-target-regression
          path: axci-rules

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache axci-affected build
        uses: actions/cache@v4
        with:
          path: axci-rules/axci-affected/target
          key: axci-affected-${{ runner.os }}-${{ hashFiles('axci-rules/axci-affected/Cargo.lock') }}
          restore-keys: axci-affected-${{ runner.os }}-

      - name: Build axci-affected engine
        id: build_engine
        run: |
          if (cd axci-rules/axci-affected && cargo build --release 2>/dev/null); then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build component matrices
        id: matrix
        run: |
          set -e
          EVENT="${{ github.event_name }}"
          MANUAL_COMPONENT="${{ inputs.component }}"
          MAP_FILE=".github/axci-component-map.json"
          RULES_FILE=".github/axci-test-target-rules.json"
          BASE_REF="${{ steps.git.outputs.base_ref }}"

          if [ ! -f "$MAP_FILE" ]; then
            echo "skip_all=true" >> "$GITHUB_OUTPUT"
            echo "integration_matrix=[]" >> "$GITHUB_OUTPUT"
            echo "check_matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ALL=$(jq -c '.components | map({crate_name, manifest_path, default_targets, force_all: (.force_all // false)})' "$MAP_FILE")

          # Manual dispatch: the specified component always runs a full integration test
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$MANUAL_COMPONENT" ] && [ "$MANUAL_COMPONENT" != "auto" ]; then
            if [ "$MANUAL_COMPONENT" = "all" ]; then
              INTEGRATION=$(echo "$ALL" | jq -c 'map({crate_name, manifest_path, default_targets})')
            else
              INTEGRATION=$(echo "$ALL" | jq -c --arg c "$MANUAL_COMPONENT" '[.[] | select(.crate_name == $c) | {crate_name, manifest_path, default_targets}]')
            fi
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
            echo "integration_matrix=$INTEGRATION" >> "$GITHUB_OUTPUT"
            echo "check_matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Auto detection: try axci-affected engine first, fall back to affected_crates.sh
          TARGETS_JSON="null"
          SKIP_ALL="false"
          ENGINE="axci-rules/axci-affected/target/release/axci-affected"

          if [ "${{ steps.build_engine.outputs.built }}" = "true" ] && [ -x "$ENGINE" ]; then
            ENGINE_OUT=$("$ENGINE" . "$BASE_REF" "$RULES_FILE" 2>/dev/null) || ENGINE_OUT=""
            if [ -n "$ENGINE_OUT" ] && echo "$ENGINE_OUT" | jq -e '.skip_all != null and .targets != null' >/dev/null 2>&1; then
              if [ "$(echo "$ENGINE_OUT" | jq -r '.skip_all')" = "true" ]; then
                SKIP_ALL="true"
                TARGETS_JSON="[]"
              else
                TARGETS_JSON=$(echo "$ENGINE_OUT" | jq -c '.targets')
                echo "axci-affected targets: $TARGETS_JSON"
              fi
            fi
          fi

          # Bash fallback using affected_crates.sh
          if [ "$TARGETS_JSON" = "null" ]; then
            echo "Engine unavailable, falling back to affected_crates.sh"
            AFFECTED_SCRIPT="axci-rules/scripts/affected_crates.sh"
            CRATES_OUT=""
            if [ -x "$AFFECTED_SCRIPT" ]; then
              CRATES_OUT=$(bash "$AFFECTED_SCRIPT" . "$BASE_REF" 2>/dev/null) || CRATES_OUT=""
            fi

            if [ -z "$CRATES_OUT" ]; then
              TARGETS_JSON=$(echo "$ALL" | jq -c '[.[].crate_name]')
            else
              CHANGED=$(echo "$CRATES_OUT" | jq -c '.changed_crates // []')
              AFFECTED=$(echo "$CRATES_OUT" | jq -c '.affected_crates // []')
              if [ "$(echo "$CHANGED" | jq 'length')" = "0" ]; then
                # No code changes detected: check if there are any non-code-only changes
                CHANGED_FILES=$(git diff --name-only "$BASE_REF" 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || true)
                if [ -z "$CHANGED_FILES" ]; then
                  SKIP_ALL="true"
                  TARGETS_JSON="[]"
                else
                  # Changed files exist but no crate detected: safe fallback to run all
                  TARGETS_JSON=$(echo "$ALL" | jq -c '[.[].crate_name]')
                fi
              else
                TESTABLE=$(echo "$ALL" | jq -c '[.[].crate_name]')
                # run_all_crates: if axconfig/axhal directly changed, run all
                RUN_ALL_CRATES=$(jq -c '.run_all_crates // []' "$RULES_FILE" 2>/dev/null || echo "[]")
                HAS_RUN_ALL=$(echo "$CHANGED" | jq --argjson rac "$RUN_ALL_CRATES" \
                  '[ .[] | select(. as $c | ($rac | index($c)) != null) ] | length > 0')
                if [ "$HAS_RUN_ALL" = "true" ]; then
                  TARGETS_JSON="$TESTABLE"
                else
                  TARGETS_JSON=$(echo "$AFFECTED" | jq -c --argjson t "$TESTABLE" \
                    '[ .[] | select(. as $c | ($t | index($c)) != null) ]')
                  if [ "$TARGETS_JSON" = "[]" ]; then
                    # Unrecognized code change: safe fallback to run all
                    TARGETS_JSON="$TESTABLE"
                  fi
                fi
              fi
            fi
          fi

          if [ "$SKIP_ALL" = "true" ]; then
            echo "skip_all=true" >> "$GITHUB_OUTPUT"
            echo "integration_matrix=[]" >> "$GITHUB_OUTPUT"
            echo "check_matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Split by force_all: true → full integration test; false → cargo check only
          INTEGRATION=$(echo "$ALL" | jq -c --argjson t "$TARGETS_JSON" \
            '[.[] | select(.crate_name as $c | ($t | index($c)) != null) | select(.force_all == true) | {crate_name, manifest_path, default_targets}]')
          CHECK=$(echo "$ALL" | jq -c --argjson t "$TARGETS_JSON" \
            '[.[] | select(.crate_name as $c | ($t | index($c)) != null) | select(.force_all != true) | {crate_name, manifest_path, default_targets}]')

          echo "skip_all=false" >> "$GITHUB_OUTPUT"
          echo "integration_matrix=$INTEGRATION" >> "$GITHUB_OUTPUT"
          echo "check_matrix=$CHECK" >> "$GITHUB_OUTPUT"
          echo "Detection complete: integration=$(echo "$INTEGRATION" | jq -c '[.[].crate_name]') check=$(echo "$CHECK" | jq -c '[.[].crate_name]')"

  component-self-check:
    needs: detect
    if: needs.detect.outputs.skip_all != 'true' && needs.detect.outputs.check_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.check_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: aarch64-unknown-none-softfloat

      - name: Component check
        run: cargo check -p ${{ matrix.crate_name }} --target aarch64-unknown-none-softfloat -F qemu

  test-components:
    needs: detect
    if: needs.detect.outputs.skip_all != 'true' && needs.detect.outputs.integration_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.integration_matrix) }}
    uses: yoinspiration/axci/.github/workflows/test.yml@test/auto-target-regression
    with:
      crate_name: ${{ matrix.crate_name }}
      test_targets: ${{ inputs.test_targets != '' && inputs.test_targets || matrix.default_targets }}
      base_ref: ${{ inputs.base_ref != '' && inputs.base_ref || 'origin/main' }}
